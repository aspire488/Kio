id: productivity.weekly_review
name: Weekly Review & Plan
description: 'End of week, aggregates completed tasks, calendar time, and notable emails/docs into a review, then drafts next
  week''s priorities for confirmation.

  '
category: productivity
version: 1.0.0
tags:
- productivity
- review
- weekly
- planning
trigger:
  type: schedule
  cron: 0 17 * * 5
config:
- name: output_dir
  type: file_path
  default: ~/KIO/reviews
  required: false
  description: Save location
- name: delivery_channel
  type: enum
  enum_values:
  - telegram
  - slack
  - email
  default: telegram
  required: false
  description: Where to send
capabilities_required:
- ai_reasoning
- artifact
- calendar
- communication
- mcp_tool
- memory
providers_required:
- llm
- python_docx
credentials_required:
- name: calendar_cred
  type: oauth2
  scopes:
  - calendar.readonly
  description: Calendar access
- name: llm_provider
  type: llm
  description: Model
- name: channel_cred
  type: bot_token
  description: Delivery token
steps:
- id: gather
  capability: memory
  action: week_activity
  inputs:
    window_days: 7
  outputs:
  - completed
  - time_spent
  - highlights
  on_error:
    retry:
      max: 1
    fallback: skip
- id: review
  capability: ai_reasoning
  action: compose_review
  inputs:
    completed: '{{ steps.gather.completed }}'
    time: '{{ steps.gather.time_spent }}'
    highlights: '{{ steps.gather.highlights }}'
  outputs:
  - review
  - next_priorities
  depends_on:
  - gather
- id: render
  capability: artifact
  action: generate_docx
  inputs:
    title: Weekly Review
    review: '{{ steps.review.review }}'
    priorities: '{{ steps.review.next_priorities }}'
    out_dir: '{{ config.output_dir }}'
  outputs:
  - file_path
  depends_on:
  - review
- id: deliver
  capability: communication
  action: send_file
  inputs:
    channel: '{{ config.delivery_channel }}'
    file: '{{ steps.render.file_path }}'
  outputs:
  - delivery_id
  depends_on:
  - render
outputs:
- name: review
  from: '{{ steps.render.file_path }}'
- name: next_priorities
  from: '{{ steps.review.next_priorities }}'
verification:
- type: artifact
  check: docx_valid
  asserts:
  - review section present
  - next-week priorities present
  on_fail: flag
failure_recovery:
  default_retry:
    max: 1
    backoff: fixed
  on_failure: notify_user
  idempotency_key: review-{{ today }}
security_classification: read_only
user_confirmation_required: false
resource_expectations:
  est_runtime_seconds: 50
  est_peak_ram_mb: 220
  network: true
  spawns_process: true
provenance:
  pattern_family: Weekly aggregation -> review + plan
  derived_from:
  - source: n8n weekly-summary templates
    url: https://n8n.io/workflows
    license: SUL
    reuse: pattern_only
  license: MIT
  portability_notes: Produces a verified DOCX and a confirmable next-week plan.
