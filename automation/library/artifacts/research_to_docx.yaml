id: artifacts.research_to_docx
name: Research → Professional DOCX Report
description: >
  Researches a topic (web + memory), plans a real document structure, writes
  substantive sectioned content with tables where useful, renders a styled DOCX,
  then reopens the file to verify headings and content before delivery.
category: artifacts
version: 1.0.0
tags: [report, docx, research, writing]
trigger:
  type: natural_language
  nl_examples:
    - "write a report on {topic}"
    - "create a Word document about {topic}"
inputs:
  - { name: topic, type: string, required: true, description: "Subject of the report" }
  - { name: audience, type: string, required: false, default: "general", description: "Who it's for" }
config:
  - { name: output_dir, type: file_path, default: "~/KIO/reports", description: "Where to save", required: false }
  - { name: length, type: enum, enum_values: [brief, standard, deep], default: standard, description: "Depth", required: false }
  - { name: style_template, type: string, default: "kio_house", description: "DOCX style template name", required: false }
capabilities_required: [ai_reasoning, artifact, filesystem]
providers_required: [llm, python_docx, libreoffice]
credentials_required:
  - { name: llm_provider, type: llm, description: "Model for research + writing" }
steps:
  - id: research
    capability: ai_reasoning
    action: research
    description: "Gather sourced facts on the topic; cite where possible."
    inputs: { query: "{{ inputs.topic }}", depth: "{{ config.length }}" }
    outputs: [findings, sources]
    on_error: { retry: { max: 2, backoff: exponential }, timeout_seconds: 120, fallback: notify }
  - id: plan
    capability: ai_reasoning
    action: plan_document
    description: "Outline: title, ordered sections, which need tables. Enforces real structure, not Overview/Key Points filler."
    inputs: { findings: "{{ steps.research.findings }}", audience: "{{ inputs.audience }}" }
    outputs: [outline]
    depends_on: [research]
  - id: content
    capability: ai_reasoning
    action: write_content
    description: "Fill each section with substantive prose and structured tables. Content IR, not a blob."
    inputs: { outline: "{{ steps.plan.outline }}", findings: "{{ steps.research.findings }}", sources: "{{ steps.research.sources }}" }
    outputs: [document_ir]
    depends_on: [plan]
  - id: render
    capability: artifact
    action: render_docx
    description: "Render the content IR to a styled DOCX with headings, TOC, tables, page numbers."
    inputs: { ir: "{{ steps.content.document_ir }}", template: "{{ config.style_template }}", out_dir: "{{ config.output_dir }}" }
    outputs: [file_path]
    depends_on: [content]
    on_error: { retry: { max: 1 }, fallback: abort }
  - id: verify
    capability: artifact
    action: verify_docx
    description: "Reopen the DOCX and assert structure/content."
    inputs: { file_path: "{{ steps.render.file_path }}", expected_sections: "{{ steps.plan.outline }}" }
    outputs: [verified, report]
    depends_on: [render]
  - id: repair
    capability: ai_reasoning
    action: repair_document
    when: "{{ steps.verify.verified }} == false"
    description: "Regenerate only failing sections and re-render. Bounded to one pass."
    inputs: { failures: "{{ steps.verify.report }}", ir: "{{ steps.content.document_ir }}" }
    outputs: [file_path]
    depends_on: [verify]
outputs:
  - { name: report_file, from: "{{ steps.render.file_path }}", description: "Final DOCX path" }
verification:
  - type: artifact
    check: docx_valid
    asserts:
      - "headings match outline sections"
      - "paragraph_count >= min_for_length"
      - "no placeholder filler text"
      - "tables present where outline flagged them"
    on_fail: repair
failure_recovery:
  default_retry: { max: 1, backoff: exponential }
  on_failure: notify_user
  idempotency_key: "{{ inputs.topic }}-{{ today }}"
security_classification: low
user_confirmation_required: false
resource_expectations: { est_runtime_seconds: 90, est_peak_ram_mb: 250, network: true, spawns_process: true }
provenance:
  pattern_family: "AI research to structured document"
  derived_from:
    - { source: "n8n.io official templates (report family)", url: "https://n8n.io/workflows", license: "SUL", reuse: pattern_only }
    - { source: "enescingoz/awesome-n8n-templates (Document Processing)", url: "https://github.com/enescingoz/awesome-n8n-templates", license: "CC-BY-4.0 (Enes Cingoz)", reuse: pattern_only }
  license: MIT
  portability_notes: "Adds a plan to content IR stage and reopen-verification that n8n versions lack."
