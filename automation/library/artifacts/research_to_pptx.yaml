id: artifacts.research_to_pptx
name: Research → Presentation (honors slide count)
description: 'Researches a topic and builds a coherent slide deck with a themed template and slide masters. The requested
  slide count flows through the plan and is asserted after render; slides are rasterized to catch text overflow before delivery.

  '
category: artifacts
version: 1.0.0
tags:
- pptx
- slides
- presentation
- research
trigger:
  type: natural_language
  nl_examples:
  - create a {n}-slide presentation about {topic}
  - make a deck on {topic}
inputs:
- name: topic
  type: string
  required: true
  description: Deck subject
- name: slide_count
  type: number
  required: false
  default: 8
  description: Exact number of slides
config:
- name: output_dir
  type: file_path
  default: ~/KIO/decks
  required: false
  description: Save location
- name: theme
  type: string
  default: kio_dark
  required: false
  description: PPTX template/theme
capabilities_required:
- ai_reasoning
- artifact
- filesystem
providers_required:
- llm
- python_pptx
- libreoffice
credentials_required:
- name: llm_provider
  type: llm
  description: Model for research + slide writing
steps:
- id: research
  capability: ai_reasoning
  action: research
  description: Collect facts for the deck.
  inputs:
    query: '{{ inputs.topic }}'
  outputs:
  - findings
  on_error:
    retry:
      max: 2
      backoff: exponential
    fallback: notify
- id: plan
  capability: ai_reasoning
  action: plan_slides
  description: Produce EXACTLY slide_count slide specs (title, <=6 bullets, notes, layout). One idea per slide.
  inputs:
    findings: '{{ steps.research.findings }}'
    count: '{{ inputs.slide_count }}'
  outputs:
  - slide_specs
  depends_on:
  - research
- id: render
  capability: artifact
  action: generate_pptx
  description: Render slide specs onto themed masters with real content density.
  inputs:
    specs: '{{ steps.plan.slide_specs }}'
    theme: '{{ config.theme }}'
    out_dir: '{{ config.output_dir }}'
  outputs:
  - file_path
  depends_on:
  - plan
  on_error:
    retry:
      max: 1
    fallback: abort
- id: verify
  capability: artifact
  action: verify_pptx
  description: Reopen with python-pptx (count==slide_count, each titled) and rasterize with LibreOffice to check overflow.
  inputs:
    file_path: '{{ steps.render.file_path }}'
    expected_count: '{{ inputs.slide_count }}'
  outputs:
  - verified
  - report
  depends_on:
  - render
outputs:
- name: deck
  from: '{{ steps.render.file_path }}'
  description: Final PPTX
verification:
- type: artifact
  check: pptx_valid
  asserts:
  - slide_count == requested slide_count
  - every slide has a title and body
  - no slide exceeds density limits (rasterized overflow check)
  - images/charts present where planned
  on_fail: repair
failure_recovery:
  default_retry:
    max: 1
    backoff: exponential
  on_failure: notify_user
security_classification: low
user_confirmation_required: false
resource_expectations:
  est_runtime_seconds: 80
  est_peak_ram_mb: 300
  network: true
  spawns_process: true
provenance:
  pattern_family: AI research to slide deck
  derived_from:
  - source: n8n.io presentation/content-generation templates
    url: https://n8n.io/workflows
    license: SUL
    reuse: pattern_only
  license: MIT
  portability_notes: Enforces exact slide count and rasterized overflow verification; typical n8n decks do neither.
