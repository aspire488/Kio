id: data.form_intake
name: Form Response → Sheet → Notify
description: >
  On a new Google Form submission, appends the response to a tracking sheet,
  optionally runs an AI triage/tag, and notifies a channel. Verifies the row was
  written before notifying.
category: data
version: 1.0.0
tags: [google, forms, sheets, intake]
trigger:
  type: event
  nl_examples: ["process new form responses for {form}"]
config:
  - { name: sheet_id, type: string, required: true, description: "Destination spreadsheet id" }
  - { name: notify_channel, type: enum, enum_values: [telegram, slack, email, none], default: slack, required: false, description: "Notify target" }
  - { name: ai_tag, type: boolean, default: false, required: false, description: "AI classify each response" }
capabilities_required: [filesystem, ai_reasoning, communication]
providers_required: [google_sheets, llm]
credentials_required:
  - { name: google_oauth, type: oauth2, scopes: ["spreadsheets"], description: "Google account" }
  - { name: channel_cred, type: bot_token, description: "Notify token" }
steps:
  - id: tag
    capability: ai_reasoning
    action: classify_response
    when: "{{ config.ai_tag }} == true"
    inputs: { response: "{{ trigger.response }}" }
    outputs: [tag]
    on_error: { retry: { max: 1 }, fallback: skip }
  - id: append
    capability: filesystem
    action: append_sheet_row
    inputs: { sheet_id: "{{ config.sheet_id }}", response: "{{ trigger.response }}", tag: "{{ steps.tag.tag }}" }
    outputs: [row_index]
    depends_on: [tag]
    on_error: { retry: { max: 2, backoff: exponential }, fallback: notify }
  - id: verify
    capability: filesystem
    action: verify_sheet_row
    inputs: { sheet_id: "{{ config.sheet_id }}", row_index: "{{ steps.append.row_index }}" }
    outputs: [verified]
    depends_on: [append]
  - id: notify
    capability: communication
    action: send_message
    when: "{{ config.notify_channel }} != none"
    inputs: { channel: "{{ config.notify_channel }}", text: "New response logged" }
    outputs: [delivery_id]
    depends_on: [verify]
outputs:
  - { name: row_index, from: "{{ steps.append.row_index }}" }
verification:
  - type: data_shape
    check: sheet_row_present
    asserts: ["row exists at returned index", "notify only after row verified"]
    on_fail: notify
failure_recovery:
  default_retry: { max: 1, backoff: exponential }
  on_failure: notify_user
  idempotency_key: "{{ trigger.response_id }}"
security_classification: low
user_confirmation_required: false
resource_expectations: { est_runtime_seconds: 15, est_peak_ram_mb: 120, network: true, spawns_process: false }
provenance:
  pattern_family: "Form -> store -> notify"
  derived_from:
    - { source: "n8n Google Forms/Sheets intake templates", url: "https://n8n.io/workflows", license: "SUL", reuse: pattern_only }
  license: MIT
  portability_notes: "Notifies only after the row is verified written."
