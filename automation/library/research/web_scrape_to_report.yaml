id: research.web_scrape_to_report
name: Web Scrape → Synthesize → Report
description: >
  Crawls/scrapes target pages (real browser for JS sites), extracts the relevant
  content, synthesizes it with AI into a structured report, and delivers a verified
  artifact. Respects robots/rate limits.
category: research
version: 1.0.0
tags: [research, scraping, browser, report]
trigger:
  type: natural_language
  nl_examples: ["research {topic} across these sites and write a report", "scrape and summarize {urls}"]
inputs:
  - { name: urls, type: array, required: true, description: "Seed URLs / sources" }
  - { name: question, type: string, required: false, description: "Focusing question" }
config:
  - { name: output_dir, type: file_path, default: "~/KIO/reports", required: false, description: "Save location" }
  - { name: max_pages, type: number, default: 15, required: false, description: "Crawl cap" }
capabilities_required: [browser, ai_reasoning, artifact]
providers_required: [playwright, llm, python_docx]
credentials_required:
  - { name: llm_provider, type: llm, description: "Synthesis model" }
steps:
  - id: crawl
    capability: browser
    action: crawl_extract
    inputs: { urls: "{{ inputs.urls }}", max_pages: "{{ config.max_pages }}" }
    outputs: [documents]
    on_error: { retry: { max: 2, backoff: exponential }, fallback: notify }
  - id: synthesize
    capability: ai_reasoning
    action: synthesize_report
    inputs: { documents: "{{ steps.crawl.documents }}", question: "{{ inputs.question }}" }
    outputs: [report_ir]
    depends_on: [crawl]
  - id: render
    capability: artifact
    action: render_docx
    inputs: { ir: "{{ steps.synthesize.report_ir }}", out_dir: "{{ config.output_dir }}" }
    outputs: [file_path]
    depends_on: [synthesize]
  - id: verify
    capability: artifact
    action: verify_docx
    inputs: { file_path: "{{ steps.render.file_path }}" }
    outputs: [verified]
    depends_on: [render]
outputs:
  - { name: report, from: "{{ steps.render.file_path }}" }
verification:
  - type: artifact
    check: docx_valid
    asserts: ["report cites source URLs", "sections have substantive content", "no filler"]
    on_fail: flag
failure_recovery:
  default_retry: { max: 1, backoff: exponential }
  on_failure: notify_user
security_classification: read_only
user_confirmation_required: false
resource_expectations: { est_runtime_seconds: 180, est_peak_ram_mb: 450, network: true, spawns_process: true }
provenance:
  pattern_family: "Scrape -> synthesize -> report"
  derived_from:
    - { source: "awesome-n8n-templates: 'Selenium Ultimate Scraper', 'Autonomous AI crawler', 'Deep Research Report Generation' (webhook|ai_reasoning+http ~23)", url: "https://github.com/enescingoz/awesome-n8n-templates", license: "CC-BY-4.0 (Enes Cingoz)", reuse: adapted }
  license: MIT
  portability_notes: "Real browser for JS pages; produces a verified artifact, not a chat blob."
