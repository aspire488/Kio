id: browser.structured_extract
name: Web → Structured Data (CSV/Sheet)
description: >
  Extracts a table or repeated list from one or more pages into typed rows and
  writes a verified CSV. Handles pagination and validates row/column shape.
category: browser
version: 1.0.0
tags: [browser, scrape, csv, extraction]
trigger:
  type: natural_language
  nl_examples:
    - "extract the table from {url} to a csv"
    - "scrape {url} into a spreadsheet"
inputs:
  - { name: url, type: url, required: true, description: "Page with the data" }
  - { name: fields, type: array, required: false, description: "Column names to extract" }
config:
  - { name: max_pages, type: number, default: 5, required: false, description: "Pagination cap" }
  - { name: output_path, type: file_path, default: "~/KIO/data/extract.csv", required: false, description: "CSV output" }
capabilities_required: [browser, ai_reasoning, filesystem]
providers_required: [playwright, llm]
credentials_required:
  - { name: none, type: none }
steps:
  - id: extract
    capability: browser
    action: extract_records
    inputs: { url: "{{ inputs.url }}", fields: "{{ inputs.fields }}", max_pages: "{{ config.max_pages }}" }
    outputs: [rows, columns]
    on_error: { retry: { max: 2, backoff: exponential }, fallback: abort }
  - id: write
    capability: filesystem
    action: write_csv
    inputs: { rows: "{{ steps.extract.rows }}", columns: "{{ steps.extract.columns }}", path: "{{ config.output_path }}" }
    outputs: [file_path, row_count]
    depends_on: [extract]
  - id: verify
    capability: filesystem
    action: verify_csv
    inputs: { path: "{{ steps.write.file_path }}", expected_columns: "{{ steps.extract.columns }}" }
    outputs: [verified]
    depends_on: [write]
outputs:
  - { name: csv, from: "{{ steps.write.file_path }}" }
  - { name: row_count, from: "{{ steps.write.row_count }}" }
verification:
  - type: data_shape
    check: csv_valid
    asserts: ["csv parses", "column count consistent across rows", "row_count > 0"]
    on_fail: flag
failure_recovery:
  default_retry: { max: 1, backoff: exponential }
  on_failure: notify_user
security_classification: read_only
user_confirmation_required: false
resource_expectations: { est_runtime_seconds: 45, est_peak_ram_mb: 400, network: true, spawns_process: true }
provenance:
  pattern_family: "Browser extract -> structured file"
  derived_from:
    - { source: "n8n scraping / HTML-extract templates", url: "https://n8n.io/workflows", license: "SUL", reuse: pattern_only }
  license: MIT
  portability_notes: "Validates CSV shape (ragged-row detection) before declaring success."
